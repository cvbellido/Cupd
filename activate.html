<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cup'd | Activate location</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body class="auth-body">
    <div class="activate-shell">
      <div class="activate-card">
        <div class="brand-row">
          <div class="brand-mark">
            <img class="brand-logo" src="./assets/cupd-logo.png" alt="Cup'd" />
            <span class="brand-wordmark">Cup'd</span>
          </div>
          <span class="brand-tag">Coffee near you</span>
        </div>

        <div class="location-intro">
          <p class="eyebrow">Before you start</p>
          <h1>Turn on your location</h1>
          <p class="subtext">
            We use your location to surface nearby cafés and pickup-ready drinks in real time.
          </p>
        </div>

        <div class="map-panel" aria-label="Map preview">
          <div class="map-grid"></div>
          <div class="map-pin pin-a"></div>
          <div class="map-pin pin-b"></div>
          <div class="map-pin pin-c"></div>
          <div class="map-label">Baltimore, MD</div>
        </div>

        <div class="auth-actions">
          <button class="primary-action" id="enableLocationBtn" type="button">Allow location</button>
          <button class="secondary-action" id="skipLocationBtn" type="button">Maybe later</button>
        </div>

        <div class="account-section">
          <div class="account-header">
            <p class="eyebrow">Account</p>
            <h2>Log in or create an account</h2>
          </div>

          <div class="account-form">
            <label>
              <span>Email</span>
              <input type="email" value="hello@cupd.coffee" aria-label="Email address" />
            </label>
            <label>
              <span>Password</span>
              <input type="password" value="••••••••" aria-label="Password" />
            </label>
          </div>

          <div class="account-row">
            <button class="primary-action compact" type="button">Log in</button>
            <button class="secondary-action compact" type="button">Create account</button>
          </div>
        </div>
      </div>
    </div>

    <script src="./js/brand.js"></script>
    <script>
      const enableLocationBtn = document.getElementById('enableLocationBtn');
      const skipLocationBtn = document.getElementById('skipLocationBtn');

      enableLocationBtn.addEventListener('click', () => {
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            () => {
              window.location.href = './index.html';
            },
            () => {
              window.location.href = './index.html';
            },
            { enableHighAccuracy: true, timeout: 10000 }
          );
        } else {
          window.location.href = './index.html';
        }
      });

      skipLocationBtn.addEventListener('click', () => {
        window.location.href = './index.html';
      });
    </script>
  </body>
</html>
